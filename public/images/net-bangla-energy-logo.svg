<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- Sun Gradients -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="1"/>
      <stop offset="35%" stop-color="#F59E0B" stop-opacity="0.95"/>
      <stop offset="80%" stop-color="#EA580C" stop-opacity="1"/>
      <stop offset="100%" stop-color="#C2410C" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="sunCorona" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0.6"/>
      <stop offset="65%" stop-color="#F59E0B" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#EA580C" stop-opacity="0"/>
    </radialGradient>

    <!-- Ray Gradient -->
    <linearGradient id="rayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>

    <!-- Panel Frame 3D Edge -->
    <linearGradient id="panelBevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>

    <!-- Solar Cell 80% Black 20% Blue Gradient -->
    <linearGradient id="cellGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111E38"/>
      <stop offset="45%" stop-color="#0B132B"/>
      <stop offset="80%" stop-color="#070D1E"/>
      <stop offset="100%" stop-color="#040814"/>
    </linearGradient>

    <!-- Cell Sheen Overlay -->
    <linearGradient id="cellSheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#0284C7" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.35"/>
    </linearGradient>

    <!-- Energy Text Gradient -->
    <linearGradient id="energyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- ICON GROUP -->
  <g transform="translate(10, 6)">
    <!-- Radiant Sun Ambient Corona -->
    <circle cx="80" cy="46" r="44" fill="url(#sunCorona)" filter="url(#glowFilter)"/>

    <!-- Radiant Sun Rays -->
    <g stroke="url(#rayGrad)" stroke-width="3.5" stroke-linecap="round" opacity="0.95">
      <line x1="42" y1="30" x2="30" y2="20" />
      <line x1="56" y1="18" x2="48" y2="6" />
      <line x1="76" y1="12" x2="76" y2="0" />
      <line x1="98" y1="16" x2="106" y2="4" />
      <line x1="116" y1="26" x2="128" y2="16" />
      <line x1="126" y1="42" x2="140" y2="38" />
      <line x1="128" y1="60" x2="142" y2="62" stroke-width="3" opacity="0.8" />
    </g>

    <!-- Radiant Sun Core Disc -->
    <circle cx="80" cy="46" r="32" fill="url(#sunGlow)"/>

    <!-- 3D SOLAR PANEL (Tilted Perspective with 16 Cells: 4x4 Matrix) -->
    <!-- 3D Lower Extrusion / Bevel Base -->
    <polygon points="12,68 90,98 92,105 16,75" fill="url(#panelBevel)" />
    <polygon points="90,98 136,78 138,85 92,105" fill="#0369A1" />

    <!-- Main Panel Base Plate (Cyan-Blue Rim) -->
    <polygon points="12,68 64,48 136,72 90,98" fill="url(#panelBevel)" stroke="#38BDF8" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- Panel Face Inset (Dark 80% Black - 20% Blue Area) -->
    <polygon points="15,68 65,49 133,72.5 89,96.5" fill="#070D1E" stroke="#0284C7" stroke-width="1"/>

    <!-- 16 CELLS (4x4 Matrix in Perspective) -->
    <!-- Row 1 (Top) -->
    <polygon points="65.5,50.5 80,55 67,59.5 53.5,54.5" fill="url(#cellGrad)" stroke="#1E3A5F" stroke-width="0.8"/>
    <polygon points="82.5,56 97,60.5 84,65 70,60.5" fill="url(#cellGrad)" stroke="#1E3A5F" stroke-width="0.8"/>
    <polygon points="99.5,61.5 114,66 101,70.5 87,66" fill="url(#cellGrad)" stroke="#1E3A5F" stroke-width="0.8"/>
    <polygon points="116.5,67 131,71.5 118,76 104,71.5" fill="url(#cellGrad)" stroke="#1E3A5F" stroke-width="0.8"/>

    <!-- Row 2 -->
    <polygon points="51.5,55.5 65,60.5 52,65.5 39,60" fill="url(#cellGrad)" stroke="#1E3A5F" stroke-width="0.8"/>
    <polygon points="68,61.5 82,66.5 69,71.5 55.5,66.5" fill="url(#cellGrad)" stroke="#1E3A5F" stroke-width="0.8"/>
    <polygon points="85,67 99,72 86,77 72.5,72" fill="url(#cellGrad)" stroke="#1E3A5F" stroke-width="0.8"/>
    <polygon points="102,72.5 116,77.5 103,82.5 89.5,77.5" fill="url(#cellGrad)" stroke="#1E3A5F" stroke-width="0.8"/>

    <!-- Row 3 -->
    <polygon points="37.5,61 50.5,66.5 37.5,72 25,66" fill="url(#cellGrad)" stroke="#1E3A5F" stroke-width="0.8"/>
    <polygon points="54,67.5 67.5,72.5 54.5,78 41.5,72.5" fill="url(#cellGrad)" stroke="#1E3A5F" stroke-width="0.8"/>
    <polygon points="71,73 84.5,78 71.5,83.5 58.5,78.5" fill="url(#cellGrad)" stroke="#1E3A5F" stroke-width="0.8"/>
    <polygon points="88,78.5 101.5,83.5 88.5,89 75.5,84" fill="url(#cellGrad)" stroke="#1E3A5F" stroke-width="0.8"/>

    <!-- Row 4 (Bottom) -->
    <polygon points="23.5,67 36,73 23,79 11.5,72.5" fill="url(#cellGrad)" stroke="#1E3A5F" stroke-width="0.8"/>
    <polygon points="40,73.5 53,79 40,85 27.5,79" fill="url(#cellGrad)" stroke="#1E3A5F" stroke-width="0.8"/>
    <polygon points="57,79 70,84.5 57,90.5 44.5,85" fill="url(#cellGrad)" stroke="#1E3A5F" stroke-width="0.8"/>
    <polygon points="74,84.5 87,90 74,96 61.5,90.5" fill="url(#cellGrad)" stroke="#1E3A5F" stroke-width="0.8"/>

    <!-- Sleek Micro Busbar Grid Lines & Light Reflection Sheen -->
    <polygon points="15,68 65,49 133,72.5 89,96.5" fill="url(#cellSheen)" pointer-events="none"/>
  </g>

  <!-- BRAND TYPOGRAPHY GROUP -->
  <!-- Primary Line: NET BANGLA -->
  <text x="175" y="58" font-family="'Sora', 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="38" font-weight="900" fill="#0A192F" letter-spacing="1.8">
    NET BANGLA
  </text>

  <!-- Secondary Line: ENERGY (Modern Expanded Spacing) -->
  <text x="177" y="94" font-family="'Sora', 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="url(#energyGrad)" letter-spacing="12.8">
    ENERGY
  </text>
</svg>
